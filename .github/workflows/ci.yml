# OpenQPEP Suite Official Release 1.1.0 (v1.1.0)
name: OpenQPEP Suite CI
on: [push, pull_request]
jobs:
  protocol-and-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Native C99/AVX2 libopenqpep (-Wall -Wextra -Werror)
        working-directory: protocol
        run: make -C calyx_qpep/native/csrc clean all
      - name: Install OpenQPEP Protocol Package
        working-directory: protocol
        run: pip install -e .
      - name: Verify All 10 Deterministic Golden KAT Vectors (Native C99)
        working-directory: protocol
        run: python3 -m calyx_qpep.cli verify-vectors
      - name: Verify All 10 Deterministic Golden KAT Vectors (Pure-Python Reference)
        working-directory: protocol
        run: OPENQPEP_DISABLE_NATIVE=1 python3 -m calyx_qpep.cli verify-vectors
      - name: Run Full OpenQPEP Protocol Unit & Security Regression Suite
        working-directory: protocol
        run: python3 -m unittest discover -s tests -v
      - name: Verify Suite Packaging, Manifests & Client Cryptographic Hygiene
        run: python3 verify_suite.py
