# OpenQPEP Official Release 1.0.1 (v1.0.1) CI Verification Pipeline
name: OpenQPEP CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Native C99 libopenqpep (-Wall -Wextra -Werror)
        run: make -C calyx_qpep/native/csrc clean all
      - name: Install OpenQPEP Official Release 1.0.1
        run: pip install -e .
      - name: Verify 10/10 Deterministic Golden KAT Vectors (Native C99)
        run: python3 -m calyx_qpep.cli verify-vectors
      - name: Verify 10/10 Deterministic Golden KAT Vectors (Pure-Python Reference)
        run: OPENQPEP_DISABLE_NATIVE=1 python3 -m calyx_qpep.cli verify-vectors
      - name: Run Full OpenQPEP Official Release 1.0.1 Test & Audit Suite
        run: python3 -m unittest discover -s tests -v
