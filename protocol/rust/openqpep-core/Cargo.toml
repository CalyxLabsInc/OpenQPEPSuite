# OpenQPEP v1.1.7-pc (Production Candidate 1.1.7)
[package]
name = "openqpep-core"
version = "1.1.0-pc"
edition = "2021"
license = "LicenseRef-CPOSLS-1.0"
description = "Memory-safe Rust core for OpenQPEP (NTT_3329, NTT_8380417, Wire Format v3/v3.1, PyO3/UniFFI)"

[lib]
name = "openqpep_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
python = ["pyo3"]
uniffi-bindings = ["uniffi"]

[dependencies]
zeroize = { version = "1.8", features = ["derive"] }
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
uniffi = { version = "0.28", optional = true }
